name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Verify Pages build output
        run: |
          test -f dist/prototypes/current/mindmap.html
          test -f dist/prototypes/current/lesson.html
          test -f dist/prototypes/current/page.html
          grep -q '/neuro-map-studio/assets/' dist/index.html
          node - <<'NODE'
          const { readdirSync, readFileSync } = require('node:fs');
          const { join } = require('node:path');

          const assetDirectory = 'dist/assets';
          const jsFiles = readdirSync(assetDirectory).filter((file) => file.endsWith('.js'));
          if (jsFiles.length === 0) {
            throw new Error('No built JavaScript assets were found in dist/assets.');
          }

          const bundledSource = jsFiles
            .map((file) => readFileSync(join(assetDirectory, file), 'utf8'))
            .join('\n');

          for (const snippet of [
            '/neuro-map-studio/',
            'prototypes/current/page.html',
            'prototypes/current/mindmap.html',
            'prototypes/current/lesson.html',
          ]) {
            if (!bundledSource.includes(snippet)) {
              throw new Error(`Built Pages bundle is missing expected content: ${snippet}`);
            }
          }
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
